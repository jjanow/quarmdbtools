<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charm Targets</title>
<!-- Template for quarmtools/tools/charm.py, which replaces the THEME, DATA and NAV placeholders below. -->
<style>
/*THEME*/
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; height: 100vh;
}
header, main { width: 100%; max-width: 1500px; margin: 0 auto; padding: 20px 24px; }
header { flex: none; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; padding-bottom: 8px; }
main { padding-top: 8px; flex: 1; min-height: 0; display: flex; flex-direction: column; }
main > * { flex: none; }
h1 { font-size: 24px; font-weight: 650; letter-spacing: -0.01em; margin: 0 16px 0 0; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 500; color: var(--muted); }
select, input[type=number], input[type=search] {
  font: inherit; font-size: 14px; color: var(--text); background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; box-shadow: var(--shadow); outline: none;
  transition: border-color .15s, box-shadow .15s;
}
::placeholder { color: var(--muted); opacity: .7; }
select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type=number] { width: 5.5em; }
input[type=search] { min-width: 16em; }
input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.check { flex-direction: row; align-items: center; gap: 7px; font-size: 13px; font-weight: 400; color: var(--text); padding-bottom: 7px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: end; margin-bottom: 12px; }
.summary { color: var(--muted); margin: 0 0 12px; }
.summary b { color: var(--text); }
button.csv, button.more {
  font: inherit; font-weight: 500; padding: 6px 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow);
  transition: filter .15s;
}
button.csv { margin-left: auto; }
button.more { background: var(--panel); color: var(--accent); margin: 10px auto; display: block; }
button.csv:hover, button.more:hover { filter: brightness(1.08); }
.wrap { flex: 1 1 auto; overflow: auto; min-height: 200px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 8px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
th {
  position: sticky; top: 0; z-index: 1; background: var(--panel-2); cursor: pointer; user-select: none; white-space: nowrap;
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
}
th:hover { color: var(--text); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
th[aria-sort=ascending]::after { content: " ▲"; color: var(--accent); }
th[aria-sort=descending]::after { content: " ▼"; color: var(--accent); }
tbody tr:nth-child(even) { background: var(--row-alt); }
tbody tr:hover { background: var(--hover); }
tbody tr:last-child td { border-bottom: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
a.home { color: var(--accent); text-decoration: none; align-self: center; font-size: 13px; }
.small { font-size: 12px; color: var(--muted); }
.hi { color: var(--ok); font-weight: 600; }
.lo { color: var(--done); }
.warn { color: var(--warn); }
.score { font-weight: 650; }
ul.plain { margin: 0; padding: 0; list-style: none; }
.tag {
  display: inline-block; font-size: 11px; line-height: 1.5; padding: 0 6px; margin: 0 3px 3px 0; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); white-space: nowrap;
}
.tag.named { background: none; border: 1px solid var(--dup); color: var(--dup); }
.tag.raid, .tag.bad { background: none; border: 1px solid var(--warn); color: var(--warn); }
.dead { color: var(--done); text-decoration: line-through; }
.terrain { display: inline-block; font-size: 11px; line-height: 1.5; padding: 0 6px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.terrain.outdoor { color: var(--ok); }
.terrain.mixed { color: var(--accent); }
.terrain.city, .terrain.unknown { color: var(--muted); }
.terrain.dungeon { color: var(--warn); }
.spellinfo { background: var(--accent-soft); border: 1px solid var(--border); border-radius: 12px; padding: 8px 14px; margin: 0 0 12px; }
details summary { cursor: pointer; color: var(--accent); }
footer { color: var(--muted); font-size: 12px; margin-top: 14px; }
.tabs { display: flex; gap: 4px; margin: 0 0 12px; border-bottom: 1px solid var(--border); }
.tabs button {
  font: inherit; font-weight: 550; padding: 7px 14px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
  background: none; color: var(--muted); cursor: pointer;
}
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected=true] { color: var(--accent); border-bottom-color: var(--accent); }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.view > * { flex: none; }
.view > .wrap { flex: 1 1 auto; }
.con { font-weight: 600; white-space: nowrap; }
.con.c0 { color: var(--ok); } .con.c1 { color: #0891b2; } .con.c2 { color: #2563eb; }
.con.c3 { color: var(--text); } .con.c4 { color: #ca8a04; } .con.c5 { color: #dc2626; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .con.c1 { color: #22d3ee; }
  :root:not([data-theme="light"]) .con.c2 { color: #60a5fa; } :root:not([data-theme="light"]) .con.c4 { color: #facc15; }
  :root:not([data-theme="light"]) .con.c5 { color: #f87171; } }
:root[data-theme="dark"] .con.c1 { color: #22d3ee; } :root[data-theme="dark"] .con.c2 { color: #60a5fa; }
:root[data-theme="dark"] .con.c4 { color: #facc15; } :root[data-theme="dark"] .con.c5 { color: #f87171; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 8px 14px; margin: 0 0 12px; box-shadow: var(--shadow); }
.panel > summary { font-weight: 550; }
.faclist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2px 16px; max-height: 260px; overflow: auto; margin-top: 8px; }
.faclist label { flex-direction: row; align-items: center; gap: 7px; font-size: 13px; color: var(--text); font-weight: 400; }
.facbar { display: flex; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.facbar button.more { margin: 0; }
tr.zone { cursor: pointer; }
tr.zone.open { background: var(--hover); }
tr.detail > td { background: var(--panel-2); padding: 10px 14px 14px; }
tr.detail table { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
tr.detail th { position: static; }
.ladder table td, .ladder table th { padding: 5px 8px; }
.ladder .scroll { max-height: 320px; overflow: auto; margin-top: 8px; }
.big { font-size: 15px; font-weight: 650; }
@media (max-width: 640px) { h1 { width: 100%; } button.csv { margin-left: 0; } input[type=search] { min-width: 0; } }
@media (max-height: 520px) { body { display: block; height: auto; } }
</style>
</head>
<body>
<header>
  <!--NAV--><h1>Charm Targets</h1>
  <label>Character <select id="char"></select></label>
  <label>Level <input id="level" type="number" min="1" max="65"></label>
  <label>Charm spell <select id="spell"></select></label>
</header>
<main>
  <div class="tabs" role="tablist">
    <button role="tab" data-view="pets" aria-selected="true">Charm pets</button>
    <button role="tab" data-view="hunt" aria-selected="false">Hunting grounds</button>
  </div>
  <p class="spellinfo" id="spellinfo"></p>
  <section class="view" id="petsView">
  <div class="bar">
    <label>Search <input id="search" type="search" placeholder="NPC or zone"></label>
    <label>Min level <input id="minlvl" type="number" min="1" max="65"></label>
    <label>Max level <input id="maxlvl" type="number" min="1" max="65"></label>
    <label>Zones <select id="terrain">
      <option value="3">All</option><option value="1">Outdoor &amp; mixed</option><option value="0">Outdoor only</option>
    </select></label>
    <label class="check"><input id="outfirst" type="checkbox" checked> Outdoor first</label>
    <label class="check"><input id="named" type="checkbox"> Named only</label>
    <label class="check"><input id="raid" type="checkbox"> Show raid targets</label>
    <label class="check"><input id="nospawn" type="checkbox"> Show NPCs that never spawn</label>
    <label class="check"><input id="live" type="checkbox"> <span id="livelabel">Only spawns live now</span></label>
    <button class="csv" id="csv">Download CSV (current view)</button>
  </div>
  <p class="summary" id="summary"></p>
  <div class="wrap" id="wrap"><table id="table"><thead></thead><tbody></tbody></table><button class="more" id="more" hidden></button></div>
  <footer id="footer"></footer>
  </section>
  <section class="view" id="huntView" hidden>
  <div class="bar">
    <label>Search <input id="hsearch" type="search" placeholder="Zone, pet or mob"></label>
    <label>Zones <select id="hterrain">
      <option value="0">Outdoor only</option><option value="1" selected>Outdoor &amp; mixed</option><option value="3">All</option>
    </select></label>
    <label title="Only pets scoring at least this much against a typical NPC of their level">Min pet score <input id="hscore" type="number" step="0.1" min="0" value="1"></label>
    <label title="Seconds per kill spent pulling, walking and keeping the charm up">Seconds per pull <input id="hover" type="number" min="0" step="5"></label>
    <label class="check"><input id="hflag" type="checkbox" checked> Zones that need a flag</label>
  </div>
  <details class="panel" id="factions"><summary id="facsum"></summary>
    <div class="facbar"><input id="facsearch" type="search" placeholder="Filter factions">
      <label class="check"><input id="facall" type="checkbox"> Show every faction</label>
      <button class="more" id="facreset">Reset to defaults</button></div>
    <div class="faclist" id="faclist"></div>
  </details>
  <details class="panel ladder" id="ladder"><summary>Level ladder: the best zones for each level on the way to 65</summary><div id="ladderbody"></div></details>
  <p class="summary" id="hsummary"></p>
  <div class="wrap"><table id="htable"><thead></thead><tbody></tbody></table></div>
  <footer id="hfooter"></footer>
  </section>
</main>
<script>
const DATA = /*DATA*/null;
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem("ct." + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem("ct." + k, v); } catch (e) {} },
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const npcUrl = id => `https://www.pqdi.cc/npc/${id}`;
const spellUrl = id => `https://www.pqdi.cc/spell/${id}`;
const SPELLS = Object.fromEntries(DATA.spells.map(s => [s.id, s]));
const EXPANSIONS = ["Classic", "Kunark", "Velious", "Luclin", "Planes of Power"];
const PAGE = 300;
const RANK = DATA.terrain_rank;
const TERRAIN_TITLES = {outdoor: "Open zone: a charm break is easy to survive", mixed: "Partly open (castle grounds, ruins)",
  city: "City: guards and crowds", dungeon: "Dungeon: a broken pet brings its neighbours", unknown: "Not classified"};
const terrainTag = t => `<span class="terrain ${t}" title="${TERRAIN_TITLES[t] || ""}">${t}</span>`;
// The most open terrain among the zones shown for an NPC.
const terrain = r => zones(r).reduce((best, z) => RANK[z[7]] < RANK[best] ? z[7] : best, "unknown");
let shown = PAGE;
let view = "pets";
let sort = {key: "s", dir: -1};

const fmt = (n, d = 0) => n == null ? "" : Number(n).toLocaleString(undefined, {maximumFractionDigits: d, minimumFractionDigits: d});
const ratio = r => `<span class="${r >= 1.5 ? "hi" : r < 0.8 ? "lo" : ""}">${fmt(r, 2)}×</span>`;
const duration = ticks => { const s = ticks * 6; return s >= 60 ? `${+(s / 60).toFixed(1)} min` : `${s}s`; };
const respawn = s => !s ? "" : s >= 3600 ? `${+(s / 3600).toFixed(1)}h` : s >= 60 ? `${Math.round(s / 60)}m` : `${s}s`;

// A zone entry is [short, long name, expansion, spawn points, best chance %, fastest respawn s, live in era].
function zonesHtml(r) {
  const li = z => `<li class="${z[6] ? "" : "dead"}" title="${z[6] ? "" : "not live in this era"}"><b>${esc(z[1])}</b> ${terrainTag(z[7])} ` +
    `<span class="small">${z[3] > 1 ? `${z[3]} spawns · ` : ""}${z[4] < 100 ? `${fmt(z[4], z[4] < 10 ? 1 : 0)}% chance · ` : ""}` +
    `${respawn(z[5]) ? `respawn ${respawn(z[5])}` : ""}${z[2] != null ? ` · ${EXPANSIONS[z[2]] || "era " + z[2]}` : ""}</span></li>`;
  const zs = [...zones(r)].sort((a, b) => RANK[a[7]] - RANK[b[7]] || b[6] - a[6]), first = zs.slice(0, 2), rest = zs.slice(2);
  if (!zs.length) return `<span class="small">no spawn point</span>`;
  return `<ul class="plain">${first.map(li).join("")}</ul>` + (rest.length ?
    `<details class="small"><summary>+${rest.length} more</summary><ul class="plain">${rest.map(li).join("")}</ul></details>` : "");
}
const zones = r => $("live").checked ? r.z.filter(z => z[6]) : r.z;

const COLUMNS = [
  {key: "n", label: "NPC", html: r => `<a href="${npcUrl(r.id)}" target="_blank" rel="noopener">${esc(r.n)}</a>` +
    (r.named ? ` <span class="tag named">named</span>` : "") + (r.raid ? ` <span class="tag raid">raid</span>` : "") +
    `<div class="small">${esc(DATA.npc_classes[r.c] || "class " + r.c)}${DATA.bodies[r.b] ? " · " + esc(DATA.bodies[r.b]) : ""}` +
    `${r.ids.length ? ` · ${r.ids.length + 1} copies` : ""}</div>`, text: r => r.n},
  {key: "l", label: "Level", num: true, html: r => r.ml > r.l ? `${r.l}–${r.ml}` + (r.ml > cap() ? ` <span class="warn small">some above cap</span>` : "") : r.l,
    text: r => r.ml > r.l ? `${r.l}-${r.ml}` : r.l},
  {key: "s", label: "Score", num: true, title: "Weighted geometric mean of the DPS, HP and AC ratios to a typical NPC of this level",
    html: r => `<span class="score ${r.s >= 1.5 ? "hi" : r.s < 0.8 ? "lo" : ""}">${fmt(r.s, 2)}</span>`},
  {key: "tr", label: "Terrain", title: "Most open zone it spawns in: outdoor, mixed, city or dungeon",
    html: r => r.z.length ? terrainTag(terrain(r)) : "", text: r => r.z.length ? terrain(r) : "", sortVal: r => RANK[terrain(r)]},
  {key: "dps", label: "DPS", num: true, title: "Estimated melee damage per second as a charmed pet", html: r => fmt(r.dps, 1)},
  {key: "rd", label: "DPS ×", num: true, title: "DPS ÷ median DPS of NPCs this level", html: r => ratio(r.rd)},
  {key: "hp", label: "HP", num: true, html: r => fmt(r.hp)},
  {key: "rh", label: "HP ×", num: true, html: r => ratio(r.rh)},
  {key: "ac", label: "AC", num: true},
  {key: "ra", label: "AC ×", num: true, html: r => ratio(r.ra)},
  {key: "rg", label: "Regen", num: true, title: "HP regenerated per tick (6 seconds)", html: r => fmt(r.rg)},
  {key: "hit", label: "Hit", num: true, title: "Min–max damage per hit", html: r => `${r.mn}–${r.mx}`, sortVal: r => (r.mn + r.mx) / 2, text: r => `${r.mn}-${r.mx}`},
  {key: "dl", label: "Delay", num: true, title: "Seconds between attack rounds", html: r => fmt(r.dl / 10, 1), text: r => r.dl / 10},
  {key: "h", label: "Hits/rnd", num: true, title: "Expected hits per round: attacks, double attack, dual wield", html: r => fmt(r.h, 2)},
  {key: "mr", label: "MR", num: true, title: "Magic resist: higher means charm lands less and breaks more"},
  {key: "margin", label: "Margin", num: true, title: "Levels below the charm spell's cap", sortVal: r => cap() - r.l, html: r => cap() - r.l, text: r => cap() - r.l},
  {key: "t", label: "Abilities", html: r => r.t.map(t => `<span class="tag">${esc(t)}</span>`).join("") +
    (r.cs ? `<span class="tag">casts spells</span>` : ""), text: r => r.t.concat(r.cs ? ["casts spells"] : []).join("; ")},
  {key: "z", label: "Where", html: zonesHtml, text: r => zones(r).map(z => z[1]).join("; "), sortVal: r => (zones(r)[0] || [, "~"])[1]},
];

const character = () => DATA.characters.find(c => c.key === $("char").value) || DATA.characters[0];
const level = () => Number($("level").value) || character().level;
const spell = () => SPELLS[$("spell").value];
const cap = () => (spell() || {cap: 0}).cap;

// Charm spells this character's class gets: from the book for a real character, else any with a scroll.
function classSpells(ch) {
  return DATA.spells.filter(s => s.levels[ch.class_id] != null && (ch.known ? ch.known.includes(s.id) : s.scroll))
    .sort((a, b) => a.levels[ch.class_id] - b.levels[ch.class_id]);
}
// Same rule as best_spell() in charm.py: highest cap, unresistable short charms only as a last resort.
function bestSpell(ch, lvl) {
  const usable = classSpells(ch).filter(s => ch.known || s.levels[ch.class_id] <= lvl);
  const normal = usable.filter(s => s.resist_diff > -1000);
  const pool = normal.length ? normal : usable;
  return pool.reduce((best, s) => !best || s.cap > best.cap || s.cap === best.cap && s.levels[ch.class_id] > best.levels[ch.class_id] ? s : best, null);
}

function fillSpells(keepSaved) {
  const ch = character(), lvl = level(), list = classSpells(ch);
  const sel = $("spell");
  sel.innerHTML = list.length ? list.map(s => `<option value="${s.id}">${esc(s.name)} (L${s.levels[ch.class_id]}, up to ${s.cap})` +
    `${!ch.known && s.levels[ch.class_id] > lvl ? " – above level" : ""}</option>`).join("") : `<option value="">no charm spell</option>`;
  // A pick is saved as "picked:best"; once a better spell is available (a level-up, a fresh
  // spellbook export) the old pick no longer applies.
  const best = bestSpell(ch, lvl), [picked, bestThen] = (keepSaved && store.get("spell." + ch.key) || "").split(":");
  sel.value = picked && bestThen === String(best ? best.id : "") && list.some(s => String(s.id) === picked) ? picked : best ? best.id : "";
}

// The level range is remembered per character and spell; a spell without one starts at cap - window .. cap.
const rangeKey = () => `range.${$("char").value}.${$("spell").value}`;
function setLevelRange() {
  const c = cap(), saved = store.get(rangeKey());
  if (saved) [$("minlvl").value, $("maxlvl").value] = saved.split(",");
  else { $("maxlvl").value = c || ""; $("minlvl").value = c ? Math.max(1, c - DATA.level_window) : ""; }
}

function canCharm(s, r) {
  const bodies = DATA.target_bodies[s.targettype];
  return (bodies == null || bodies.includes(r.b)) && r.l <= s.cap;
}

function filtered() {
  const s = spell();
  if (!s) return [];
  const q = $("search").value.trim().toLowerCase();
  const lo = Number($("minlvl").value) || 0, hi = Number($("maxlvl").value) || 99;
  const maxRank = Number($("terrain").value), outFirst = $("outfirst").checked;
  const named = $("named").checked, raid = $("raid").checked, nospawn = $("nospawn").checked, live = $("live").checked;
  const rows = DATA.npcs.filter(r => canCharm(s, r) && r.l >= lo && r.l <= hi &&
    (!named || r.named) && (raid || !r.raid) && (nospawn ? true : r.z.length) && (!live || !r.z.length && nospawn || r.z.some(z => z[6])) &&
    (maxRank >= 3 || RANK[terrain(r)] <= maxRank) &&
    (!q || r.n.toLowerCase().includes(q) || r.z.some(z => z[1].toLowerCase().includes(q) || z[0].includes(q))));
  const col = COLUMNS.find(c => c.key === sort.key) || COLUMNS[2];
  const val = col.sortVal || (r => r[col.key]);
  rows.sort((a, b) => {
    if (outFirst) {
      const t = RANK[terrain(a)] - RANK[terrain(b)];
      if (t) return t;
    }
    const x = val(a), y = val(b);
    const c = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), undefined, {numeric: true});
    return c * sort.dir || b.s - a.s;
  });
  return rows;
}

function render() {
  const ch = character(), s = spell(), rows = filtered();
  $("spellinfo").innerHTML = s ?
    `<a href="${spellUrl(s.id)}" target="_blank" rel="noopener"><b>${esc(s.name)}</b></a>: charms <b>${esc(DATA.target_labels[s.targettype])}</b> ` +
    `up to level <b>${s.cap}</b> · lasts up to ${duration(s.duration)}` +
    (s.resist_diff ? ` · resist adjustment ${s.resist_diff}` : "") +
    (ch.known && !ch.known.includes(s.id) ? ` · <span class="warn">not in ${esc(ch.name)}'s spellbook</span>` : "") +
    (!ch.known && s.levels[ch.class_id] > level() ? ` · <span class="warn">needs level ${s.levels[ch.class_id]}</span>` : "") :
    `<span class="warn">${esc(ch.name)} has no charm spell in their spellbook${ch.known ? "" : " at this level"}.</span>` +
    (ch.known ? " Pick a New character entry to see what a spell would reach." : "");
  if (view === "hunt") { renderHunt(); return; }
  const thead = $("table").tHead, tbody = $("table").tBodies[0];
  thead.innerHTML = "<tr>" + COLUMNS.map(c => `<th data-key="${c.key}" class="${c.num ? "num" : ""}"` +
    (c.title ? ` title="${esc(c.title)}"` : "") +
    (sort.key === c.key ? ` aria-sort="${sort.dir > 0 ? "ascending" : "descending"}"` : "") + `>${esc(c.label)}</th>`).join("") + "</tr>";
  tbody.innerHTML = rows.slice(0, shown).map(r => "<tr>" +
    COLUMNS.map(c => `<td class="${c.num ? "num" : ""}">${c.html ? c.html(r) : esc(r[c.key])}</td>`).join("") + "</tr>").join("")
    || `<tr><td colspan="${COLUMNS.length}">Nothing to show.</td></tr>`;
  $("more").hidden = rows.length <= shown;
  $("more").textContent = `Show ${Math.min(PAGE, rows.length - shown)} more of ${rows.length - shown} remaining`;
  const strong = rows.filter(r => r.s >= 1.5).length, outdoor = rows.filter(r => r.z.length && terrain(r) === "outdoor");
  $("summary").innerHTML = s ? `<b>${rows.length}</b> NPCs ${esc(s.name)} can charm in this level range, ` +
    `<b>${strong}</b> of them scoring 1.5× or more a typical mob of their level. ` +
    `<b>${outdoor.length}</b> spawn outdoors (<b>${outdoor.filter(r => r.s >= 1.5).length}</b> of those at 1.5× or more). ` +
    `Showing ${Math.min(rows.length, shown)}.` : "";
}

function toCsv() {
  const rows = filtered();
  const cell = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const header = COLUMNS.map(c => c.label).concat(["PQDI"]);
  const lines = [header.map(cell).join(",")].concat(rows.map(r => COLUMNS.map(c => cell(c.text ? c.text(r) : r[c.key]))
    .concat([npcUrl(r.id)]).map(cell).join(",")));
  const blob = new Blob([lines.join("\r\n") + "\r\n"], {type: "text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `charm-${character().name.replace(/\W+/g, "_")}-${(spell() || {name: "none"}).name.replace(/\W+/g, "_")}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

    `A charmed pet keeps the NPC's own stats. DPS is estimated from the server's charmed pet code: attacks per round, ` +
    `double attack by level, triple attack for level 60+ warriors and monks, dual wield only for NPCs flagged with it ` +
    `(offhand weapons from loot aren't counted), average of min and max hit. Charmed pets never flurry or rampage. ` +
    `Terrain is each zone classified by hand: outdoor, mixed (partly open: castle grounds, ruins), city or dungeon; ` +
    `an NPC's terrain is the most open zone it spawns in. "Outdoor first" ranks outdoor NPCs above mixed, city and ` +
    `dungeon ones, then by the chosen column. Misses, kicks and bashes, and spells are ignored. Not charmable and left out: NPCs immune to charm, magic or players, ` +
    `merchants, bankers and guildmasters, Veksar's level 50+ NPCs. Struck-out zones aren't live in ` +

init();

// ---------------------------------------------------------------------------- hunting grounds
// Same model as quarmtools/tools/hunt.py (rank_zones); keep the two in step.
const H = DATA.hunt, XP = H.xp;
const CON_NAMES = ["green", "light blue", "blue", "white", "yellow", "red"];
const conTag = (player, mob) => { const c = (XP.cons[player] || [])[Math.min(mob, XP.cons[player].length - 1)]; return `<span class="con c${c}">${CON_NAMES[c]}</span>`; };
const TARGETS_BY_ZONE = {};
for (const t of H.targets) for (const z of t.z) (TARGETS_BY_ZONE[z[0]] ||= []).push([t, z]);
const FACTION_ORDER = Object.keys(H.factions).sort((a, b) => H.factions[a].localeCompare(H.factions[b]));
const pct = (f, d) => `${fmt(f * 100, d ?? (f >= 0.1 ? 0 : 1))}%`;
const perHour = z => z[1] * (z[3] || 100) / 100 * (z[2] ? 3600 / z[2] : 1);
const mins = s => s >= 90 ? `${fmt(s / 60, 1)} min` : `${fmt(s)}s`;

// Kill experience as a fraction of the player's level (zone/exp.cpp), capped at 12.5% a kill.
function killFrac(player, mob, zem, expPct, race) {
  const row = XP.mult[player];
  if (!row || expPct <= 0) return 0;
  const mult = row[Math.min(mob, row.length - 1)];
  if (!mult) return 0;
  const exp = mob * mob * zem * 100 * expPct / 100 * mult * (XP.hell[player] || 1);
  return Math.min(exp / (XP.span[player] * (XP.race_exp[race] || 100) / 100), XP.cap);
}

// Factions that matter for this character: the defaults (minus ones PQ Companion saw it scowling with),
// then the page's own on/off overrides.
const facKey = () => "fac." + $("char").value;
function facOverrides() { try { return JSON.parse(store.get(facKey()) || "{}"); } catch (e) { return {}; } }
function defaultMatters(ch) { const off = ch.scowl || {}; return new Set(H.matters.map(String).filter(f => !(f in off))); }
function matters() {
  const set = defaultMatters(character());
  for (const [f, on] of Object.entries(facOverrides())) on ? set.add(f) : set.delete(f);
  return set;
}
function factionHits(nfid, m) {
  const bad = [], other = [], good = [];
  for (const [f, v] of H.sets[nfid] || []) (v > 0 ? good : m.has(String(f)) ? bad : other).push([f, v]);
  return {bad, other, good};
}
const facNames = list => list.map(([f, v]) => `${esc(H.factions[f] || "faction " + f)} ${v > 0 ? "+" : ""}${v}`).join(", ");

const huntOpts = () => ({overhead: $("hover").value === "" ? H.overhead : Number($("hover").value),
  minScore: Number($("hscore").value) || 0, maxRank: Number($("hterrain").value), flags: $("hflag").checked});

// One pet's hour in a zone. Each target gets a status; viable ones are taken greedily by experience per
// second of cycle time (fight, pet regen for what it lost, overhead), each up to how often it spawns.
function zonePlan(pet, zone, zem, player, race, m, overhead, detail) {
  const opts = [], rows = [];
  for (const [t, z] of TARGETS_BY_ZONE[zone] || []) {
    const hits = factionHits(t.f, m), frac = killFrac(player, t.l, zem, t.x, race);
    const ttk = pet.dps > 0 ? t.hp / pet.dps : Infinity, lost = t.dps * ttk;
    const status = hits.bad.length ? "faction" : !frac ? "no xp" : lost > H.survive * pet.hp ? "too strong" : "ok";
    const row = {t, z, frac, ttk, lost, hits, status, kills: 0, cycle: ttk + lost / (Math.max(pet.rg, 1) / 6) + overhead};
    if (status === "ok") opts.push(row);
    if (detail) rows.push(row);
  }
  opts.sort((a, b) => b.frac / b.cycle - a.frac / a.cycle);
  let budget = 3600, total = 0;
  for (const o of opts) {
    if (budget <= 0) break;
    o.kills = Math.min(perHour(o.z), budget / o.cycle);
    budget -= o.kills * o.cycle;
    total += o.kills * o.frac;
  }
  return {total, used: opts.filter(o => o.kills > 0), rows};
}

function petsByZone(s, minScore) {
  const out = {};
  for (const r of DATA.npcs) {
    if (r.raid || r.s < minScore || !canCharm(s, r)) continue;
    for (const z of r.z) if (z[6]) (out[z[0]] ||= []).push(r);
  }
  for (const k in out) out[k] = out[k].sort((a, b) => b.dps - a.dps).slice(0, H.pets_per_zone);
  return out;
}

function zoneOk(zone, o) {
  const info = H.zones[zone];
  return info && (o.maxRank >= 3 || RANK[info[1]] <= o.maxRank) && (o.flags || !info[4]);
}

// Every zone with a pet and something to kill, best first: {zone, info, total, pet, used, pets: [[pet, total]]}.
function rankZones(player, s, race, m, o) {
  const out = [], pets = petsByZone(s, o.minScore);
  for (const [zone, list] of Object.entries(pets)) {
    if (!zoneOk(zone, o)) continue;
    const info = H.zones[zone], tried = [];
    for (const p of list) {
      const plan = zonePlan(p, zone, info[2], player, race, m, o.overhead, false);
      if (plan.total > 0) tried.push([p, plan]);
    }
    if (!tried.length) continue;
    tried.sort((a, b) => b[1].total - a[1].total);
    out.push({zone, info, total: tried[0][1].total, pet: tried[0][0], used: tried[0][1].used, pets: tried});
  }
  return out.sort((a, b) => b.total - a.total);
}

// The charm spell a character would use at a level: the book's, plus any scroll their class can buy by then.
function ladderSpell(ch, lvl) {
  const usable = DATA.spells.filter(s => s.levels[ch.class_id] != null &&
    (ch.known && ch.known.includes(s.id) || s.scroll && s.levels[ch.class_id] <= lvl));
  const normal = usable.filter(s => s.resist_diff > -1000), pool = normal.length ? normal : usable;
  return pool.reduce((best, s) => !best || s.cap > best.cap || s.cap === best.cap && s.levels[ch.class_id] > best.levels[ch.class_id] ? s : best, null);
}

let openZone = null, ladderCache = {};
function renderLadder(ch, m, o) {
  if (!$("ladder").open) return;
  const key = JSON.stringify([ch.key, level(), [...m].sort(), o]);
  if (ladderCache.key !== key) {
    const rows = [];
    // The last level gained is the cap; at the cap kills only give AA experience.
    for (let lvl = Math.max(1, level()); lvl < XP.max_level; lvl++) {
      const s = ladderSpell(ch, lvl);
      rows.push({lvl, s, zones: s ? rankZones(lvl, s, ch.race, m, o).slice(0, 3) : []});
    }
    ladderCache = {key, rows};
  }
  $("ladderbody").innerHTML = `<div class="scroll"><table><thead><tr><th class="num">Level</th><th>Charm spell</th><th>Best zones (pet · share of a level per hour)</th></tr></thead><tbody>` +
    ladderCache.rows.map(r => `<tr><td class="num">${r.lvl}</td><td>${r.s ? `${esc(r.s.name)} <span class="small">up to ${r.s.cap}</span>` : `<span class="warn">none</span>`}</td><td>` +
      (r.zones.length ? r.zones.map(z => `<b>${esc(z.info[0])}</b> <span class="small">${esc(z.pet.n)} L${z.pet.l} · ${pct(z.total)}/h (~${fmt(1 / z.total, 1)} h a level)</span>`).join("<br>") : `<span class="small">nothing found</span>`) +
      `</td></tr>`).join("") + `</tbody></table></div>`;
}

function renderFactions(ch) {
  const m = matters(), defaults = defaultMatters(ch), q = $("facsearch").value.trim().toLowerCase(), all = $("facall").checked;
  const changed = Object.keys(facOverrides()).length;
  $("facsum").innerHTML = `Factions that matter: <b>${m.size}</b> on` + (changed ? ` (${changed} changed from the defaults)` : "") +
    ` <span class="small">· kills that lower any of these are left out</span>`;
  if (!$("factions").open) return;
  const scowl = ch.scowl || {}, starts = ch.starts_scowl || {};
  const list = FACTION_ORDER.filter(f => (all || m.has(f) || defaults.has(f) || f in scowl) &&
    (!q || H.factions[f].toLowerCase().includes(q)));
  list.sort((a, b) => m.has(b) - m.has(a));
  $("faclist").innerHTML = list.map(f => `<label title="${esc(scowl[f] || starts[f] || "")}"><input type="checkbox" data-f="${f}"${m.has(f) ? " checked" : ""}>` +
    `${esc(H.factions[f])}${scowl[f] ? ` <span class="tag bad">${esc(scowl[f])}</span>` : starts[f] ? ` <span class="small">starts scowling</span>` : ""}</label>`).join("")
    || `<span class="small">No factions match.</span>`;
}

// How reliably the pet is there: spawn points, chance and respawn in this zone.
function petSpawn(p, zone) {
  const z = p.z.find(z => z[0] === zone);
  if (!z) return "";
  return [z[3] > 1 ? `${z[3]} spawns` : "1 spawn", z[4] < 100 ? `<span class="${z[4] < 25 ? "warn" : ""}">${fmt(z[4], z[4] < 10 ? 1 : 0)}% chance</span>` : "",
    respawn(z[5]) ? `respawn ${respawn(z[5])}` : ""].filter(Boolean).join(" · ");
}

function targetLine(o, player) {
  return `<a href="${npcUrl(o.t.id)}" target="_blank" rel="noopener">${esc(o.t.n)}</a> L${o.t.l} ${conTag(player, o.t.l)} ` +
    `<span class="small">${pct(o.frac, 1)}/kill · ${fmt(o.kills, o.kills < 10 ? 1 : 0)}/h</span>`;
}

function zoneDetail(r, player, race, m, o) {
  const plan = zonePlan(r.pet, r.zone, r.info[2], player, race, m, o.overhead, true);
  const order = {ok: 0, "too strong": 1, faction: 2, "no xp": 3};
  plan.rows.sort((a, b) => (b.kills > 0) - (a.kills > 0) || order[a.status] - order[b.status] || b.frac - a.frac);
  const blockers = {};
  for (const row of plan.rows) if (row.status === "faction" && row.frac) for (const [f] of row.hits.bad) blockers[f] = (blockers[f] || 0) + 1;
  const status = row => row.kills > 0 ? `<span class="hi">${fmt(row.kills, row.kills < 10 ? 1 : 0)} kills/h</span>` :
    row.status === "ok" ? `<span class="small">spare (hour already full)</span>` :
    row.status === "faction" ? `<span class="warn">faction: ${facNames(row.hits.bad)}</span>` :
    row.status === "too strong" ? `<span class="warn">pet loses ${pct(row.lost / r.pet.hp)} HP</span>` : `<span class="small">no experience</span>`;
  const blockList = Object.entries(blockers).sort((a, b) => b[1] - a[1]);
  return `<div class="small" style="margin-bottom:8px">Other pets here: ` + (r.pets.slice(1, 4).map(([p, pl]) =>
      `<a href="${npcUrl(p.id)}" target="_blank" rel="noopener">${esc(p.n)}</a> L${p.l} (${pct(pl.total)}/h)`).join(", ") || "none") +
    (blockList.length ? ` · <span class="warn">Left out for faction:</span> ` + blockList.map(([f, n]) => `${esc(H.factions[f])} (${n} mobs)`).join(", ") : "") +
    `</div><table><thead><tr><th>Target</th><th class="num">Level</th><th>Con</th><th class="num">Per kill</th><th class="num">Fight</th>` +
    `<th class="num">Pet HP lost</th><th class="num">Spawns/h</th><th>Faction</th><th>Plan</th></tr></thead><tbody>` +
    plan.rows.map(row => `<tr><td><a href="${npcUrl(row.t.id)}" target="_blank" rel="noopener">${esc(row.t.n)}</a>` +
      (row.t.fl & 1 ? ` <span class="tag bad">summons</span>` : "") + (row.t.fl & 2 ? ` <span class="tag bad">magic weapons only</span>` : "") +
      `</td><td class="num">${row.t.l}</td><td>${conTag(player, row.t.l)}</td><td class="num">${row.frac ? pct(row.frac, 2) : "–"}</td>` +
      `<td class="num">${mins(row.ttk)}</td><td class="num">${pct(Math.min(row.lost / r.pet.hp, 9.99))}</td><td class="num">${fmt(perHour(row.z), 1)}</td>` +
      `<td class="small">${row.hits.bad.length ? `<span class="warn">${facNames(row.hits.bad)}</span> ` : ""}${row.hits.other.length ? facNames(row.hits.other) + " " : ""}` +
      `${row.hits.good.length ? `<span class="hi">${facNames(row.hits.good)}</span>` : ""}</td><td>${status(row)}</td></tr>`).join("") + `</tbody></table>`;
}

let huntRows = [];
function renderHunt() {
  const ch = character(), s = spell(), player = level(), m = matters(), o = huntOpts();
  renderFactions(ch);
  renderLadder(ch, m, o);
  const thead = $("htable").tHead, tbody = $("htable").tBodies[0];
  thead.innerHTML = `<tr><th class="num">#</th><th>Zone</th><th>Best pet</th><th class="num" title="Estimated share of a level per hour at this level">Level/h</th>` +
    `<th class="num">Kills/h</th><th>What to kill</th></tr>`;
  if (!s) { tbody.innerHTML = `<tr><td colspan="6">No charm spell.</td></tr>`; $("hsummary").innerHTML = ""; return; }
  const q = $("hsearch").value.trim().toLowerCase();
  huntRows = rankZones(player, s, ch.race, m, o).filter(r => !q || r.info[0].toLowerCase().includes(q) || r.zone.includes(q) ||
    r.pets.some(([p]) => p.n.toLowerCase().includes(q)) || r.used.some(u => u.t.n.toLowerCase().includes(q)));
  tbody.innerHTML = huntRows.map((r, i) => {
    const kills = r.used.reduce((a, u) => a + u.kills, 0);
    const row = `<tr class="zone${openZone === r.zone ? " open" : ""}" data-zone="${esc(r.zone)}"><td class="num">${i + 1}</td>` +
      `<td><b>${esc(r.info[0])}</b> ${terrainTag(r.info[1])}<div class="small" title="Zone experience multiplier${r.info[6] ? ", plus the hot zone bonus" : ""}">ZEM ${fmt(r.info[5], 2)}${r.info[6] ? ` + hot ${fmt(r.info[2] - r.info[5], 2)}` : ""}` +
      `${r.info[3] != null ? " · " + (EXPANSIONS[r.info[3]] || "era " + r.info[3]) : ""}${r.info[4] ? ` · <span class="warn">needs a flag</span>` : ""}</div></td>` +
      `<td><a href="${npcUrl(r.pet.id)}" target="_blank" rel="noopener">${esc(r.pet.n)}</a> L${r.pet.l}` +
      `<div class="small">score ${fmt(r.pet.s, 2)} · ${fmt(r.pet.dps, 0)} DPS · ${fmt(r.pet.hp)} HP</div>` +
      `<div class="small">${petSpawn(r.pet, r.zone)}</div></td>` +
      `<td class="num big">${pct(r.total)}</td><td class="num">${fmt(kills)}</td>` +
      `<td><ul class="plain">${r.used.slice(0, 3).map(u => `<li>${targetLine(u, player)}</li>`).join("")}</ul>` +
      (r.used.length > 3 ? `<span class="small">+${r.used.length - 3} more · click for all</span>` : "") + `</td></tr>`;
    return row + (openZone === r.zone ? `<tr class="detail"><td colspan="6">${zoneDetail(r, player, ch.race, m, o)}</td></tr>` : "");
  }).join("") || `<tr><td colspan="6">No zone has both a pet ${esc(s.name)} can take and something safe to kill at level ${player}.</td></tr>`;
  const best = huntRows[0];
  $("hsummary").innerHTML = `<b>${huntRows.length}</b> zones where ${esc(s.name)} can take a pet and a level ${player} ` +
    `${esc(DATA.classes[ch.class_id])} has safe experience to kill.` + (best ? ` Best: <b>${esc(best.info[0])}</b> with ` +
    `${esc(best.pet.n)}, about <b>${pct(best.total)}</b> of a level an hour.` : "") + ` Click a zone for every mob in it.`;
}

function setView(v) {
  view = v;
  store.set("tab", v);
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === v)));
  $("petsView").hidden = v !== "pets";
  $("huntView").hidden = v !== "hunt";
  render();
}

function initHunt() {
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
  for (const id of ["hterrain", "hscore", "hover"]) {
    const v = store.get("h." + id);

    $(id).addEventListener("change", () => { store.set("h." + id, $(id).value); render(); });
  }
  if ($("hover").value === "") $("hover").value = H.overhead;
  const flag = store.get("h.hflag");
  if (flag != null) $("hflag").checked = flag === "1";
  $("hflag").addEventListener("input", () => { store.set("h.hflag", $("hflag").checked ? "1" : "0"); render(); });
  $("hsearch").addEventListener("input", render);
  $("facsearch").addEventListener("input", () => renderFactions(character()));
  $("facall").addEventListener("input", () => renderFactions(character()));
  $("factions").addEventListener("toggle", () => renderFactions(character()));
  $("ladder").addEventListener("toggle", () => { store.set("h.ladder", $("ladder").open ? "1" : "0"); render(); });
  if (store.get("h.ladder") !== "0") $("ladder").open = true;
  $("faclist").addEventListener("change", e => {
    const f = e.target.dataset.f;
    if (!f) return;
    const over = facOverrides(), dflt = defaultMatters(character()).has(f);
    if (e.target.checked === dflt) delete over[f]; else over[f] = e.target.checked ? 1 : 0;
    store.set(facKey(), JSON.stringify(over));
    render();
  });
  $("facreset").addEventListener("click", () => { store.set(facKey(), "{}"); render(); });
  $("htable").tBodies[0].addEventListener("click", e => {
    const tr = e.target.closest("tr.zone");
    if (!tr || e.target.closest("a")) return;
    openZone = openZone === tr.dataset.zone ? null : tr.dataset.zone;
    render();
  });
  $("hfooter").innerHTML = `How this works: for each zone, every pet the charm spell can take there (the ${H.pets_per_zone} with the most DPS, ` +
    `at or above the minimum score) is tried against every mob that spawns in the same zone, since charm breaks when you zone. ` +
    `A mob counts if it cons above green, gives experience, doesn't lower a faction that matters, and the pet wouldn't lose more than ` +
    `${H.survive * 100}% of its HP killing it (fight time = mob HP ÷ pet DPS; misses, mitigation and the mob's spells are ignored). ` +
    `Each kill costs the fight, the time for the pet to regenerate what it lost, and the seconds per pull. The hour is filled with the ` +
    `best experience per second first, each mob only as often as it spawns (spawn points × chance ÷ respawn). ` +
    `Experience follows the server: level² × (zone multiplier + the hot zone bonus, which this database gives every open zone) × the NPC's experience percent, light blue and level-51+ ` +
    `bonuses within 5 levels, the per-level modifiers and the 12.5%-a-kill cap. Solo, with no experience going to AA. Since Luclin a mob your pet kills ` +
    `without any damage from you gives 25%, so land a nuke or DoT on each. The numbers are for comparing zones; real rates are lower. ` +
    `Factions: the defaults are every faction with merchants, bankers, guildmasters or guards, minus ones PQ Companion last saw ` +
    `you scowling or threatening with. "Starts scowling" is from race, class and deity only and doesn't switch a faction off. ` +
    `Faction choices are saved per character in this browser.`;
  const tab = store.get("tab");
  if (tab === "hunt") setView("hunt");
}
initHunt();
</script>
</body>
</html>
